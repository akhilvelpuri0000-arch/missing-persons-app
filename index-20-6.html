<title>Missing Persons Registry</title>
<style>
  :root{
    --teal:#0F3D3E; --teal-dark:#0A2C2D; --sand:#F7F3EC; --white:#FFFFFF;
    --slate:#5B6B6C; --amber:#C97A2B; --line:#E4DFD3; --red:#B94A3B; --green:#3F7A52;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Telugu",sans-serif;background:var(--sand);color:var(--teal-dark);display:flex;justify-content:center;}
  #app{width:100%;max-width:400px;min-height:100vh;background:var(--white);display:flex;flex-direction:column;position:relative;}
  header{background:var(--teal);color:var(--white);padding:22px 20px 20px;position:relative;}
  header .eyebrow{font-size:13px;opacity:.75;margin-bottom:4px;}
  header h1{margin:0;font-size:21px;font-weight:600;padding-right:60px;}
  header p{margin:6px 0 0;font-size:13.5px;opacity:.85;line-height:1.5;}
  .lang-toggle{position:absolute;top:20px;right:16px;display:flex;background:rgba(255,255,255,.15);border-radius:16px;overflow:hidden;font-size:11px;}
  .lang-toggle span{padding:5px 10px;cursor:pointer;}
  .lang-toggle span.active{background:rgba(255,255,255,.35);font-weight:700;}
  .lang-toggle-select{position:absolute;top:16px;right:16px;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--teal-dark);max-width:120px;}
  .cta-row{display:flex;gap:10px;padding:20px 20px 6px;}
  .search-box{margin:16px 20px 0;position:relative;}
  .search-box input{width:100%;padding:11px 14px 11px 36px;border:1px solid var(--line);border-radius:20px;font-size:13.5px;font-family:inherit;background:#FBF9F4;color:var(--teal-dark);}
  .search-box .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--slate);}
  .cta{flex:1;border-radius:10px;padding:14px;cursor:pointer;}
  .cta.report{background:#FDF7F3;border:1px solid #EAD2C8;}
  .cta.sight{background:#EEF4EF;border:1px solid #D3E3D6;}
  .cta .t1{font-size:13px;font-weight:700;}
  .cta.report .t1{color:var(--amber);}
  .cta.sight .t1{color:var(--green);}
  .cta .t2{font-size:11px;color:var(--slate);margin-top:2px;}
  .section{padding:20px;}
  .case-card{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer;}
  .ph{width:48px;height:48px;border-radius:8px;background:#DDD5C2;flex-shrink:0;}
  .case-body{flex:1;}
  .case-body h4{margin:0;font-size:13.5px;}
  .case-body .meta{font-size:11.5px;color:var(--slate);margin-top:3px;}
  .note{margin:4px 20px 20px;background:#EEF4EF;border:1px solid #D3E3D6;border-radius:8px;padding:12px 14px;font-size:12px;color:var(--slate);line-height:1.55;}
  nav{position:sticky;bottom:0;background:var(--white);border-top:1px solid var(--line);display:flex;max-width:400px;}
  nav .tab{flex:1;text-align:center;padding:11px 0 9px;font-size:11px;color:var(--slate);cursor:pointer;}
  nav .tab.active{color:var(--teal);font-weight:600;}
  form{padding:20px;}
  .group-title{font-size:12.5px;font-weight:700;color:var(--teal);margin-bottom:10px;margin-top:18px;}
  .field{margin-bottom:14px;}
  label{display:block;font-size:13px;color:var(--slate);margin-bottom:5px;}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:14.5px;font-family:inherit;color:var(--teal-dark);background:var(--white);}
  textarea{resize:none;height:64px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .submit-btn{width:100%;background:var(--teal);color:var(--white);border:none;padding:14px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;}
  .error-msg{color:var(--red);font-size:12.5px;margin-bottom:10px;}
  .success{text-align:center;padding:60px 30px;}
  .success .icon{font-size:40px;margin-bottom:12px;}
  .admin-header{background:var(--teal);color:var(--white);padding:20px;display:flex;justify-content:space-between;align-items:center;}
  .logout-btn{background:rgba(255,255,255,.15);color:var(--white);border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;}
  .row-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px;}
  .row-card h4{margin:0;font-size:14px;}
  .row-card .meta{font-size:12px;color:var(--slate);margin:4px 0 8px;}
  .actions{display:flex;gap:6px;}
  .btn-approve,.btn-reject{font-size:12px;padding:7px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--line);}
  .btn-approve{border-color:var(--green);background:var(--green);color:var(--white);}
  .btn-reject{border-color:#EAD2C8;color:var(--red);background:var(--white);}
  .loading{padding:20px;font-size:13px;color:var(--slate);}
</style>
</head>

  function t(key) { return T[lang][key] || key; }

  function langToggleHtml() {
    return `<select data-lang-select class="lang-toggle-select">
      ${LANGS.map(([code, label]) => `<option value="${code}" ${lang===code?'selected':''}>${label}</option>`).join('')}
    </select>`;
  }
  function attachLangToggle() {
    document.querySelectorAll("[data-lang]").forEach(el => {
      el.addEventListener("click", () => {
        lang = el.dataset.lang;
        document.documentElement.lang = lang;
        render();
      });
    });
    document.querySelectorAll("[data-lang-select]").forEach(sel => {
      sel.addEventListener("change", () => {
        lang = sel.value;
        document.documentElement.lang = lang;
        render();
      });
    });
  }

  // ---------- Password show/hide toggle ----------
  // Wraps a password <input id="X"> so an eye/eye-off SVG icon can toggle its visibility.
  // (Using an inline SVG instead of an emoji so it renders identically on every device.)
  // Usage in markup: passwordFieldHtml('a_pw', t('password'))
  const EYE_SVG = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const EYE_OFF_SVG = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.86 21.86 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.86 21.86 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
  function passwordFieldHtml(inputId, labelText) {
    return `<div class="field">
      <label>${labelText}</label>
      <div style="position:relative;">
        <input id="${inputId}" type="password" style="padding-right:44px;">
        <span data-pw-toggle="${inputId}" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;user-select:none;color:var(--slate);display:flex;align-items:center;">${EYE_SVG}</span>
      </div>
    </div>`;
  }
  function attachPasswordToggles() {
    document.querySelectorAll("[data-pw-toggle]").forEach(icon => {
      icon.addEventListener("click", () => {
        const input = document.getElementById(icon.dataset.pwToggle);
        if (!input) return;
        if (input.type === "password") { input.type = "text"; icon.innerHTML = EYE_OFF_SVG; }
        else { input.type = "password"; icon.innerHTML = EYE_SVG; }
      });
    });
  }

  // ---------- Photo upload: preview + remove ----------
  // Wraps a file <input id="X"> with a live thumbnail preview and a Remove button
  // once a photo is chosen, so people can check/replace what they picked before submitting.
  // Usage: photoFieldHtml('r_photo', t('photoLabel')) in markup, then setupPhotoPreview('r_photo') after render.
  function photoFieldHtml(inputId, labelText, hintText, extraAttrs = "") {
    return `<div class="field">
      <label>${labelText}</label>
      <input type="file" id="${inputId}" accept="image/*" ${extraAttrs} style="border:2px dashed var(--line);padding:20px 10px;background:#FBF9F4;">
      ${hintText ? `<small style="color:var(--slate);font-size:11px;">${hintText}</small>` : ''}
      <div id="${inputId}_preview" style="display:none;margin-top:10px;position:relative;width:110px;">
        <img id="${inputId}_img" style="width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">
        <span data-photo-remove="${inputId}" style="position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;">✕</span>
      </div>
    </div>`;
  }
  function setupPhotoPreview(inputId) {
    const input = document.getElementById(inputId);
    const preview = document.getElementById(inputId + "_preview");
    const img = document.getElementById(inputId + "_img");
    if (!input || !preview || !img) return;
    input.addEventListener("change", () => {
      const file = input.files[0];
      if (!file) { preview.style.display = "none"; return; }
      img.src = URL.createObjectURL(file);
      preview.style.display = "block";
    });
    const removeBtn = document.querySelector(`[data-photo-remove="${inputId}"]`);
    if (removeBtn) removeBtn.addEventListener("click", () => {
      input.value = "";
      preview.style.display = "none";
    });
  }

  // ---------- Firestore helpers ----------
  async function generateCaseId() {
    const year = new Date().getFullYear();
    const counterRef = doc(db, "counters", "missing_persons");
    const seq = await runTransaction(db, async (tx) => {
      const snap = await tx.get(counterRef);
      const current = snap.exists() ? (snap.data().count || 0) : 0;
      const next = current + 1;
      tx.set(counterRef, { count: next }, { merge: true });
      return next;
    });
    return `MP-${year}-${String(seq).padStart(4, "0")}`;
  }

  // ---------- Staff roles (Admin / Police) ----------
  // A staff member's role is looked up from Firestore doc: staff_roles/{email} -> { role: "admin" | "police" }.
  // There is NO default role — if no doc exists for an email, that account cannot access
  // the Admin or Police console at all. This means the very first Admin account must be
  // created manually, ONE TIME, in the Firebase console:
  //   Firestore -> create collection "staff_roles" -> doc ID = your admin email -> field role = "admin"
  // After that, the Admin can approve Police applications (with ID proof) from inside the app,
  // which writes further staff_roles docs automatically — no more manual Firestore edits needed.
  let lastStaffRoleDebug = ""; // last diagnostic info from getStaffRole, shown in login error messages
  async function getStaffRole(user) {
    if (!user || !user.email) { lastStaffRoleDebug = "no-user"; return null; }
    try {
      const snap = await getDoc(doc(db, "staff_roles", user.email));
      if (snap.exists()) {
        const r = snap.data().role;
        if (r === "admin" || r === "police") { lastStaffRoleDebug = "ok:" + r; return r; }
        lastStaffRoleDebug = "doc-exists-bad-role:" + JSON.stringify(snap.data());
        return null;
      }
      lastStaffRoleDebug = "doc-not-found:" + user.email;
    } catch (e) {
      lastStaffRoleDebug = "error:" + (e.code || e.message || e);
    }
    return null;
  }

  function attachLongPress(elm, onLongPress, ms = 600) {
    let timer = null;
    let fired = false;
    const start = (e) => {
      fired = false;
      timer = setTimeout(() => { fired = true; onLongPress(); }, ms);
    };
    const cancel = () => { if (timer) clearTimeout(timer); };
    elm.addEventListener("touchstart", start, { passive: true });
    elm.addEventListener("touchend", cancel);
    elm.addEventListener("touchmove", cancel);
    elm.addEventListener("mousedown", start);
    elm.addEventListener("mouseup", cancel);
    elm.addEventListener("mouseleave", cancel);
    elm.addEventListener("click", (e) => { if (fired) { e.preventDefault(); e.stopPropagation(); } });
  }

  function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  async function renderNearby() {
    el.innerHTML = `
      <header>${langToggleHtml()}<div class="eyebrow">${t('nearbyEyebrow')}</div><h1>${t('nearbyTitle')}</h1></header>

    attachLangToggle();
    let userLat = null, userLng = null, radius = "all";

    function renderChips() {
      const opts = [["2","2km"],["5","5km"],["10","10km"],["25","25km"],["all",t('allCases')]];
      document.getElementById("radiusChips").innerHTML = opts.map(([val,label]) => `
        <div data-radius="${val}" style="flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12.5px;cursor:pointer;border:1px solid var(--line);${radius===val ? 'background:var(--teal);color:var(--white);border-color:var(--teal);' : 'background:var(--white);color:var(--slate);'}">${label}</div>

    }

    let allCases = [];
    function renderList() {
      const list = document.getElementById("nearList");
      let cases = allCases;
      if (userLat !== null && radius !== "all") {
        const r = parseFloat(radius);
        cases = cases.filter(c => {
          if (c.last_seen_lat == null || c.last_seen_lng == null) return false;
          return haversineKm(userLat, userLng, c.last_seen_lat, c.last_seen_lng) <= r;
        });
      }
      if (userLat !== null) {
        cases = [...cases].sort((a, b) => {
          const da = (a.last_seen_lat != null) ? haversineKm(userLat, userLng, a.last_seen_lat, a.last_seen_lng) : Infinity;
          const db = (b.last_seen_lat != null) ? haversineKm(userLat, userLng, b.last_seen_lat, b.last_seen_lng) : Infinity;
          return da - db;
        });
      }
      if (cases.length === 0) {
        list.innerHTML = `<div style="font-size:13px;color:var(--slate);">${t('noNearby')}</div>`;
        return;
      }
      list.innerHTML = cases.map(c => {
        const mapHtml = (c.last_seen_lat && c.last_seen_lng) ? `
          <iframe
            style="width:100%;height:140px;border:none;border-radius:8px;margin-top:10px;"
            loading="lazy"
            src="https://www.openstreetmap.org/export/embed.html?bbox=${c.last_seen_lng-0.01}%2C${c.last_seen_lat-0.01}%2C${c.last_seen_lng+0.01}%2C${c.last_seen_lat+0.01}&layer=mapnik&marker=${c.last_seen_lat}%2C${c.last_seen_lng}">
          </iframe>` : '';
        let distText = '';
        if (userLat !== null && c.last_seen_lat != null) {
          distText = ` • ${haversineKm(userLat, userLng, c.last_seen_lat, c.last_seen_lng).toFixed(1)} ${t('distanceAway')}`;
        }
        const contactHtml = (c.police_station || c.police_contact) ? `
          <div style="font-size:11px;color:var(--slate);margin-top:6px;">
            ${c.police_station ? `🏢 ${c.police_station}` : ''}
            ${c.police_contact ? ` • <a href="tel:${c.police_contact}" style="color:var(--teal);">${c.police_contact}</a>` : ''}
          </div>` : '';
        return `
        <div class="row-card">
          <div style="display:flex;gap:12px;">
            <div class="ph" style="${c.photo_url ? `background-image:url('${c.photo_url}');background-size:cover;background-position:center;` : ''}"></div>
            <div style="flex:1;">
              <h4>${c.name}, ${c.age}</h4>
              <div class="meta">${c.last_seen_location||''}${distText} ${c.case_id ? `• ${c.case_id}` : ''}</div>
              ${contactHtml}
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
                <button class="btn-approve" onclick="location.hash='#sighting'">${t('iSawThem')}</button>
                <button class="btn-approve" style="background:var(--teal);border-color:var(--teal);" onclick="location.hash='#found/${c.id}'">${t('reportFound')}</button>
              </div>
            </div>
          </div>
          ${mapHtml}
        </div>`;
      }).join('');
    }

    renderChips();
    try {
      allCases = await getApprovedCases();
      renderList();
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => { userLat = pos.coords.latitude; userLng = pos.coords.longitude; renderList(); },
          () => { /* permission denied, fall back to unsorted full list */ }
        );
      }
    } catch (e) { console.error(e); }
  }

  function computeMatchScore(c, criteria) {
    let score = 0;
    if (criteria.age && c.age) {
      const diff = Math.abs(parseInt(c.age, 10) - parseInt(criteria.age, 10));
      if (!isNaN(diff)) { if (diff <= 2) score += 3; else if (diff <= 5) score += 1; }
    }
    if (criteria.gender && c.gender && criteria.gender === c.gender) score += 2;
    if (criteria.location) {
      const words = criteria.location.toLowerCase().split(/\s+/).filter(w => w.length > 2);
      const target = (c.last_seen_location || "").toLowerCase();
      if (words.some(w => target.includes(w))) score += 3;
    }
    return score;
  }

          const pw = document.getElementById("p_pw").value;
          const photoFile = document.getElementById("p_photo").files[0];
          if (!name || !badge || !station || !email || !pw || !photoFile) {
            errBox.style.display = "block";
            errBox.textContent = t('applicationRequired');
            return;
          }
          const btn = document.getElementById("p_submit");
          btn.disabled = true; btn.textContent = t('uploadingPhoto');
          try {
            await submitPoliceApplication({ name, badge_number: badge, station, phone, email, password: pw }, photoFile);
            el.innerHTML = `<div class="success"><div class="icon">✅</div><h2>${t('applicationSuccess')}</h2><p style="color:var(--slate);font-size:13.5px;">${t('applicationSuccessSub')}</p></div>`;
            setTimeout(() => { staffScreenMode = "login"; pendingLoginRole = "police"; render(); }, 2200);
          } catch (err) {
            console.error(err);
            errBox.style.display = "block";
            errBox.textContent = err.message || t('errorGeneric');
            btn.disabled = false; btn.textContent = t('submitApplication');
          }
        });
        return;
      }

      el.innerHTML = `
        <header style="padding:16px 20px;position:relative;">${langToggleHtml()}</header>
        <div class="section">
          <h2>${t('staffLoginTitle')}</h2>
          <div style="display:flex;gap:8px;margin-bottom:16px;">
            <div id="roleAdminBtn" style="flex:1;text-align:center;padding:10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;${pendingLoginRole==='admin' ? 'background:var(--teal);color:var(--white);' : 'background:#FBF9F4;border:1px solid var(--line);color:var(--slate);'}">${t('loginAsAdmin')}</div>
            <div id="rolePoliceBtn" style="flex:1;text-align:center;padding:10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;${pendingLoginRole==='police' ? 'background:var(--teal);color:var(--white);' : 'background:#FBF9F4;border:1px solid var(--line);color:var(--slate);'}">${t('loginAsPolice')}</div>
          </div>
          <form id="loginForm">
            <div class="field"><label>${t('email')}</label><input id="a_email" type="email"></div>
            ${passwordFieldHtml('a_pw', t('password'))}
            <div id="a_error" class="error-msg" style="display:none;"></div>
            <button type="submit" class="submit-btn">${t('login')}</button>
          </form>
          ${pendingLoginRole === 'police' ? `<div style="text-align:center;margin-top:14px;font-size:12.5px;color:var(--teal);cursor:pointer;" id="goRegisterBtn">${t('policeRegisterLink')}</div>` : ''}
        </div>
        ${bottomNav("admin")}
      `;
      attachLangToggle();
      attachPasswordToggles();
      document.getElementById("roleAdminBtn").addEventListener("click", () => { pendingLoginRole = "admin"; renderAdmin(); });
      document.getElementById("rolePoliceBtn").addEventListener("click", () => { pendingLoginRole = "police"; renderAdmin(); });
      const goRegisterBtn = document.getElementById("goRegisterBtn");
      if (goRegisterBtn) goRegisterBtn.addEventListener("click", () => { staffScreenMode = "register_police"; renderAdmin(); });
      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        loginInProgress = true;
        const email = document.getElementById("a_email").value.trim();
        const pw = document.getElementById("a_pw").value;
        const errBox = document.getElementById("a_error");
        try {
          const cred = await signInWithEmailAndPassword(auth, email, pw);
          const role = await getStaffRole(cred.user);
          if (!role) {
            await signOut(auth);
            errBox.style.display = "block";
            errBox.textContent = `${t('notAuthorizedRole')} (${cred.user.email}) [${lastStaffRoleDebug}]`;
            loginInProgress = false;
            return;
          }
          if (role !== pendingLoginRole) {
            await signOut(auth);
            errBox.style.display = "block";
            errBox.textContent = `${t('roleMismatch')} (${cred.user.email} → ${role})`;
            loginInProgress = false;
            return;
          }
          loginInProgress = false;
          render();
        } catch (err) {
          console.error(err);
          loginInProgress = false;
          errBox.style.display = "block";
          errBox.textContent = `${t('loginFailed')} (${err.code || err.message || ''})`;
        }
      });
      return;
    }

    const role = currentStaffRole || "admin";
    const isPolice = role === "police";

    el.innerHTML = `
      <div class="admin-header">
        <div><div style="font-weight:700;font-size:15px;">${isPolice ? t('policeConsoleTitle') : t('adminConsoleTitle')}</div><div style="font-size:11.5px;opacity:.7;">${currentUser.email}</div></div>
        <div style="display:flex;align-items:center;gap:10px;">
          <select data-lang-select class="lang-toggle-select" style="background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:5px 6px;font-size:11px;">
            ${LANGS.map(([code, label]) => `<option value="${code}" ${lang===code?'selected':''} style="color:#000;">${label}</option>`).join('')}
          </select>
          <button class="logout-btn" id="logoutBtn">${t('logout')}</button>
        </div>
      </div>
      <div class="section" id="queueList"><div class="loading">${t('loading')}</div></div>
      ${bottomNav("admin")}
    `;
    attachLangToggle();
    document.getElementById("logoutBtn").addEventListener("click", async () => { staffScreenMode = "login"; await signOut(auth); render(); });

    try {
      const { cases, sightings, foundReports } = await getPendingQueue();
      const verifiedCases = await getVerifiedCasesForAdmin();
      const reopenable = isPolice ? await getReopenableCases() : [];
      const policeAccounts = !isPolice ? await listPoliceAccounts() : [];
      const policeApplications = !isPolice ? await getPoliceApplications() : [];
      const auditLog = await getAuditLog();
      const list = document.getElementById("queueList");
      list.innerHTML = `
        <div style="font-size:13.5px;margin-bottom:10px;">${t('pendingReg')} (${cases.length})</div>
        ${cases.length === 0 ? `<div style="font-size:12.5px;color:var(--slate);">${t('noPending')}</div>` :
          cases.map(r => `
            <div class="row-card" style="display:flex;gap:12px;">
              <div class="ph" style="${r.photo_url ? `background-image:url('${r.photo_url}');background-size:cover;background-position:center;` : ''}"></div>
              <div style="flex:1;">
                <h4>${r.name}, ${r.age} ${r.status === 'under_verification' ? `<span style="font-size:10px;background:#FCEFE4;color:var(--amber);padding:2px 6px;border-radius:4px;">${t('underVerification')}</span>` : ''}</h4>
                <div class="meta">${r.last_seen_location||''} • FIR: ${r.fir_number || t('firNone')} ${r.case_id ? `• ${r.case_id}` : ''}</div>
                ${notesPreviewHtml(r)}
                <div class="actions">
                  ${r.status === 'pending' ? `<button class="btn-reject" data-review-case="${r.id}" style="border-color:var(--amber);color:var(--amber);">${t('markUnderReview')}</button>` : ''}
                  <button class="btn-approve" data-approve-case="${r.id}">${t('approve')}</button>
                  <button class="btn-reject" data-reject-case="${r.id}">${t('reject')}</button>
                  <button class="btn-reject" data-note-case="${r.id}" style="border-color:var(--line);color:var(--slate);">${t('addNote')}</button>
                </div>
              </div>
            </div>`).join('')}
        <div style="font-size:13.5px;margin:20px 0 10px;">${t('pendingSight')} (${sightings.length})</div>
        ${sightings.length === 0 ? `<div style="font-size:12.5px;color:var(--slate);">${t('noPending')}</div>` :
          sightings.map(r => `
            <div class="row-card">
              <h4>Sighting @ ${r.location||''}</h4>
              <div class="meta">${r.notes||''}</div>
              <div class="actions">
                <button class="btn-approve" data-approve-sighting="${r.id}">${t('approve')}</button>
                <button class="btn-reject" data-reject-sighting="${r.id}">${t('reject')}</button>
              </div>
            </div>`).join('')}
        <div style="font-size:13.5px;margin:20px 0 10px;">${t('pendingFound')} (${foundReports.length})</div>
        ${foundReports.length === 0 ? `<div style="font-size:12.5px;color:var(--slate);">${t('noPending')}</div>` :
          foundReports.map(r => `
            <div class="row-card" style="display:flex;gap:12px;">
              <div class="ph" style="${r.photo_url ? `background-image:url('${r.photo_url}');background-size:cover;background-position:center;` : ''}"></div>
              <div style="flex:1;">
                <h4>✅ ${t('reportFound')} ${r.case_id ? `<span style="font-size:10px;background:#E4EEE6;color:var(--green);padding:2px 6px;border-radius:4px;">${t('linkedCase')}: ${r.case_id}</span>` : ''}</h4>
                <div class="meta">${r.location && r.location !== '-' ? r.location : ''} ${r.approx_age ? `• ${t('approxAge')}: ${r.approx_age}` : ''} ${r.approx_gender ? `• ${r.approx_gender}` : ''}</div>
                <div class="meta">${r.notes||''}</div>
                <div class="actions">
                  <button class="btn-approve" data-approve-found="${r.id}" data-found-case="${r.case_id||''}">${t('approve')}</button>
                  <button class="btn-reject" data-reject-found="${r.id}">${t('reject')}</button>
                </div>
              </div>
            </div>`).join('')}
        <div style="font-size:13.5px;margin:20px 0 10px;">${t('verifiedManage')} (${verifiedCases.length})</div>
        ${verifiedCases.length === 0 ? `<div style="font-size:12.5px;color:var(--slate);">${t('noPending')}</div>` :
          verifiedCases.map(r => `
            <div class="row-card" style="display:flex;gap:12px;">
              <div class="ph" style="${r.photo_url ? `background-image:url('${r.photo_url}');background-size:cover;background-position:center;` : ''}"></div>
              <div style="flex:1;">
                <h4>${r.name}, ${r.age} <span style="font-size:10px;background:#E4EEE6;color:var(--green);padding:2px 6px;border-radius:4px;">${t('statusVerified')}</span></h4>
                <div class="meta">${r.last_seen_location||''} ${r.case_id ? `• ${r.case_id}` : ''}</div>
                ${notesPreviewHtml(r)}
                <div class="actions">
                  <button class="btn-reject" data-close-case="${r.id}">${t('closeCase')}</button>
                  <button class="btn-reject" data-note-case="${r.id}" style="border-color:var(--line);color:var(--slate);">${t('addNote')}</button>
                </div>
              </div>
            </div>`).join('')}
        ${isPolice ? `
        <div style="font-size:13.5px;margin:20px 0 10px;">${t('historyTitle')} — ${t('reopenCase')} (${reopenable.length})</div>
        ${reopenable.length === 0 ? `<div style="font-size:12.5px;color:var(--slate);">${t('noPending')}</div>` :
          reopenable.map(r => `
            <div class="row-card" style="display:flex;gap:12px;">
              <div class="ph" style="${r.photo_url ? `background-image:url('${r.photo_url}');background-size:cover;background-position:center;` : ''}"></div>
              <div style="flex:1;">
                <h4>${r.name}, ${r.age} <span style="font-size:10px;background:#F1F1EC;color:var(--slate);padding:2px 6px;border-radius:4px;">${r.status === 'closed' ? t('statusClosed') : t('reject')}</span></h4>
                <div class="meta">${r.last_seen_location||''} ${r.case_id ? `• ${r.case_id}` : ''}</div>
                <div class="actions">
                  <button class="btn-approve" data-reopen-case="${r.id}">${t('reopenCase')}</button>
                </div>
              </div>
            </div>`).join('')}` : ''}
        ${!isPolice ? `
        <div style="font-size:13.5px;margin:20px 0 10px;">${t('pendingApplicationsTitle')} (${policeApplications.length})</div>
        ${policeApplications.length === 0 ? `<div style="font-size:12.5px;color:var(--slate);">${t('noApplications')}</div>` :
          policeApplications.map(a => `
            <div class="row-card">
              <h4>${a.name} <span style="font-size:11px;color:var(--slate);font-weight:400;">• ${a.badge_number || ''}</span></h4>
              <div class="meta">${a.station || ''} ${a.phone ? `• ${a.phone}` : ''}</div>
              <div class="meta">${a.email}</div>
              ${a.id_photo_url ? `<a href="${a.id_photo_url}" target="_blank" style="font-size:12px;color:var(--teal);">${t('viewIdProof')} ↗</a>` : ''}
              <div class="actions" style="margin-top:8px;">
                <button class="btn-approve" data-approve-application="${a.id}" data-app-email="${a.email}">${t('approve')}</button>
                <button class="btn-reject" data-reject-application="${a.id}">${t('reject')}</button>
              </div>
            </div>`).join('')}
        <div style="font-size:13.5px;margin:20px 0 10px;">${t('managePoliceTitle')}</div>
        <div class="row-card">
          <div style="display:flex;gap:8px;margin-bottom:6px;">
            <input id="policeEmailInput" type="email" placeholder="${t('policeEmailPh')}" style="flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;">
            <button class="btn-approve" id="addPoliceBtn">${t('addPoliceBtn')}</button>
          </div>
          <div style="font-size:11px;color:var(--slate);line-height:1.5;">${t('accountMustExistNote')}</div>
        </div>
        ${policeAccounts.length === 0 ? `<div style="font-size:12.5px;color:var(--slate);">${t('noPoliceAccounts')}</div>` :
          policeAccounts.map(p => `
            <div class="row-card" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <div style="font-size:13px;flex:1;word-break:break-all;">${p.email}</div>
              <button class="btn-approve" data-promote-police="${p.email}" style="white-space:nowrap;">${t('promoteToAdminBtn')}</button>
              <button class="btn-reject" data-remove-police="${p.email}">${t('removeBtn')}</button>
            </div>`).join('')}` : ''}
        <div style="font-size:13.5px;margin:20px 0 10px;">${t('actionHistoryTitle')}</div>
        ${auditLog.length === 0 ? `<div style="font-size:12.5px;color:var(--slate);">${t('noActionHistory')}</div>` :
          auditLog.map(a => `
            <div class="row-card" style="padding:10px 12px;">
              <div style="font-size:12.5px;">${a.action}${a.targetId ? ` • ${a.targetId}` : ''}</div>
              <div class="meta">${t('actedBy')}: ${a.actor_email || ''} (${a.actor_role || ''})</div>
            </div>`).join('')}
      `;
      list.querySelectorAll("[data-approve-case]").forEach(b => b.addEventListener("click", async () => { await approveCase(b.dataset.approveCase); renderAdmin(); }));
      list.querySelectorAll("[data-reject-case]").forEach(b => b.addEventListener("click", async () => { await rejectCase(b.dataset.rejectCase); renderAdmin(); }));
      list.querySelectorAll("[data-review-case]").forEach(b => b.addEventListener("click", async () => { await markUnderVerification(b.dataset.reviewCase); renderAdmin(); }));
      list.querySelectorAll("[data-close-case]").forEach(b => b.addEventListener("click", async () => { await closeCase(b.dataset.closeCase); renderAdmin(); }));
      list.querySelectorAll("[data-approve-sighting]").forEach(b => b.addEventListener("click", async () => { await approveSighting(b.dataset.approveSighting); renderAdmin(); }));
      list.querySelectorAll("[data-reject-sighting]").forEach(b => b.addEventListener("click", async () => { await rejectSighting(b.dataset.rejectSighting); renderAdmin(); }));
      list.querySelectorAll("[data-approve-found]").forEach(b => b.addEventListener("click", async () => { await approveFound(b.dataset.approveFound, b.dataset.foundCase); renderAdmin(); }));
      list.querySelectorAll("[data-reject-found]").forEach(b => b.addEventListener("click", async () => { await rejectFound(b.dataset.rejectFound); renderAdmin(); }));
      list.querySelectorAll("[data-reopen-case]").forEach(b => b.addEventListener("click", async () => { await reopenCase(b.dataset.reopenCase); renderAdmin(); }));
      list.querySelectorAll("[data-approve-application]").forEach(b => b.addEventListener("click", async () => { await approvePoliceApplication(b.dataset.approveApplication, b.dataset.appEmail); renderAdmin(); }));
      list.querySelectorAll("[data-reject-application]").forEach(b => b.addEventListener("click", async () => { await rejectPoliceApplication(b.dataset.rejectApplication); renderAdmin(); }));
      const addPoliceBtn = document.getElementById("addPoliceBtn");
      if (addPoliceBtn) addPoliceBtn.addEventListener("click", async () => {
        const emailInput = document.getElementById("policeEmailInput");
        const email = emailInput.value.trim().toLowerCase();
        if (!email) return;
        await addPoliceRole(email);
        renderAdmin();
      });
      list.querySelectorAll("[data-remove-police]").forEach(b => b.addEventListener("click", async () => { await removePoliceRole(b.dataset.removePolice); renderAdmin(); }));
      list.querySelectorAll("[data-promote-police]").forEach(b => b.addEventListener("click", async () => {
        if (confirm(t('confirmPromote'))) { await promoteToAdmin(b.dataset.promotePolice); renderAdmin(); }
      }));
      list.querySelectorAll("[data-note-case]").forEach(b => b.addEventListener("click", async () => {
        const text = prompt(t('notePh'));
        if (text && text.trim()) { await addCaseNote(b.dataset.noteCase, text.trim()); renderAdmin(); }
      }));
    } catch (e) {
      console.error(e);
      document.getElementById("queueList").innerHTML = `<div style="background:#FDF2F0;border:1px solid var(--red);border-radius:8px;padding:14px;font-size:12.5px;color:var(--red);word-break:break-all;"><b>Error:</b> ${e.message || e}</div>`;
    }
  }

  render();
</script>
</body>
</html>
