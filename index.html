<style>
  :root{
    --teal:#0F3D3E; --teal-dark:#0A2C2D; --sand:#F7F3EC; --white:#FFFFFF;
    --slate:#5B6B6C; --amber:#C97A2B; --line:#E4DFD3; --red:#B94A3B; --green:#3F7A52;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Telugu",sans-serif;background:var(--sand);color:var(--teal-dark);display:flex;justify-content:center;}
  #app{width:100%;max-width:400px;min-height:100vh;background:var(--white);display:flex;flex-direction:column;position:relative;}
  header{background:var(--teal);color:var(--white);padding:22px 20px 20px;position:relative;}
  header .eyebrow{font-size:13px;opacity:.75;margin-bottom:4px;}
  header h1{margin:0;font-size:21px;font-weight:600;padding-right:60px;}
  header p{margin:6px 0 0;font-size:13.5px;opacity:.85;line-height:1.5;}
  .lang-toggle{position:absolute;top:20px;right:16px;display:flex;background:rgba(255,255,255,.15);border-radius:16px;overflow:hidden;font-size:11px;}
  .lang-toggle span{padding:5px 10px;cursor:pointer;}
  .lang-toggle span.active{background:rgba(255,255,255,.35);font-weight:700;}
  .cta-row{display:flex;gap:10px;padding:20px 20px 6px;}
  .search-box{margin:16px 20px 0;position:relative;}
  .search-box input{width:100%;padding:11px 14px 11px 36px;border:1px solid var(--line);border-radius:20px;font-size:13.5px;font-family:inherit;background:#FBF9F4;color:var(--teal-dark);}
  .search-box .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--slate);}
  .cta{flex:1;border-radius:10px;padding:14px;cursor:pointer;}
  .cta.report{background:#FDF7F3;border:1px solid #EAD2C8;}
  .cta.sight{background:#EEF4EF;border:1px solid #D3E3D6;}
  .cta .t1{font-size:13px;font-weight:700;}
  .cta.report .t1{color:var(--amber);}
  .cta.sight .t1{color:var(--green);}
  .cta .t2{font-size:11px;color:var(--slate);margin-top:2px;}
  .section{padding:20px;}
  .case-card{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer;}
  .ph{width:48px;height:48px;border-radius:8px;background:#DDD5C2;flex-shrink:0;}
  .case-body{flex:1;}
  .case-body h4{margin:0;font-size:13.5px;}
  .case-body .meta{font-size:11.5px;color:var(--slate);margin-top:3px;}
  .note{margin:4px 20px 20px;background:#EEF4EF;border:1px solid #D3E3D6;border-radius:8px;padding:12px 14px;font-size:12px;color:var(--slate);line-height:1.55;}
  nav{position:sticky;bottom:0;background:var(--white);border-top:1px solid var(--line);display:flex;max-width:400px;}
  nav .tab{flex:1;text-align:center;padding:11px 0 9px;font-size:11px;color:var(--slate);cursor:pointer;}
  nav .tab.active{color:var(--teal);font-weight:600;}
  form{padding:20px;}
  .group-title{font-size:12.5px;font-weight:700;color:var(--teal);margin-bottom:10px;margin-top:18px;}
  .field{margin-bottom:14px;}
  label{display:block;font-size:13px;color:var(--slate);margin-bottom:5px;}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:14.5px;font-family:inherit;color:var(--teal-dark);background:var(--white);}
  textarea{resize:none;height:64px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .submit-btn{width:100%;background:var(--teal);color:var(--white);border:none;padding:14px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;}
  .error-msg{color:var(--red);font-size:12.5px;margin-bottom:10px;}
  .success{text-align:center;padding:60px 30px;}
  .success .icon{font-size:40px;margin-bottom:12px;}
  .admin-header{background:var(--teal);color:var(--white);padding:20px;display:flex;justify-content:space-between;align-items:center;}
  .logout-btn{background:rgba(255,255,255,.15);color:var(--white);border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;}
  .row-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px;}
  .row-card h4{margin:0;font-size:14px;}
  .row-card .meta{font-size:12px;color:var(--slate);margin:4px 0 8px;}
  .actions{display:flex;gap:6px;}
  .btn-approve,.btn-reject{font-size:12px;padding:7px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--line);}
  .btn-approve{border-color:var(--green);background:var(--green);color:var(--white);}
  .btn-reject{border-color:#EAD2C8;color:var(--red);background:var(--white);}
  .loading{padding:20px;font-size:13px;color:var(--slate);}
</style>

  #splash {
    position: fixed; inset: 0; z-index: 9999;

  #splash p { color: rgba(247,243,236,0.7); font-size: 12.5px; margin: 0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Telugu",sans-serif; }

  // ---------- Firestore helpers ----------
  async function generateCaseId() {
    const year = new Date().getFullYear();
    const counterRef = doc(db, "counters", "missing_persons");
    const seq = await runTransaction(db, async (tx) => {
      const snap = await tx.get(counterRef);
      const current = snap.exists() ? (snap.data().count || 0) : 0;
      const next = current + 1;
      tx.set(counterRef, { count: next }, { merge: true });
      return next;
    });
    return `MP-${year}-${String(seq).padStart(4, "0")}`;
  }
  async function submitMissingPersonRegistration(data) {
    const case_id = await generateCaseId();
    return addDoc(collection(db, "missing_persons"), { ...data, case_id, status: "pending", created_at: serverTimestamp() });
  }
  async function submitSightingReport(data) {
    return addDoc(collection(db, "sighting_reports"), { ...data, status: "pending", type: "sighting", created_at: serverTimestamp() });
  }
  async function submitFoundReport(data) {
    return addDoc(collection(db, "sighting_reports"), { ...data, status: "pending", type: "found", created_at: serverTimestamp() });
  }
  async function getApprovedCases() {
    const q = query(collection(db, "missing_persons"), where("status", "==", "verified"));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  async function getPendingQueue() {
    const casesQ = query(collection(db, "missing_persons"), where("status", "in", ["pending", "under_verification"]));
    const sightingsQ = query(collection(db, "sighting_reports"), where("status", "==", "pending"));
    const [c, s] = await Promise.all([getDocs(casesQ), getDocs(sightingsQ)]);
    const allReports = s.docs.map(d => ({ id: d.id, ...d.data() }));
    return {
      cases: c.docs.map(d => ({ id: d.id, ...d.data() })),
      sightings: allReports.filter(r => r.type !== "found"),
      foundReports: allReports.filter(r => r.type === "found"),
    };
  }
  async function getVerifiedCasesForAdmin() {
    const q = query(collection(db, "missing_persons"), where("status", "==", "verified"));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  async function markUnderVerification(id) { await updateDoc(doc(db, "missing_persons", id), { status: "under_verification" }); }
  async function closeCase(id) { await updateDoc(doc(db, "missing_persons", id), { status: "closed" }); }
  async function getClosedCases() {
    const q = query(collection(db, "missing_persons"), where("status", "==", "closed"));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  async function getAdminProfile(uid) {
    const snap = await getDoc(doc(db, "admins", uid));
    return snap.exists() ? snap.data() : null;
  }
  async function addNewAdmin(email, password, name) {
    // Uses the secondary app instance so the current admin's session is untouched.
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
    const newUid = cred.user.uid;
    await setDoc(doc(db, "admins", newUid), { name: name || "", role: "admin", verified: true });
    await secondaryAuth.signOut();
    return newUid;
  }
  async function approveCase(id) { await updateDoc(doc(db, "missing_persons", id), { status: "verified" }); }
  async function rejectCase(id) { await updateDoc(doc(db, "missing_persons", id), { status: "rejected" }); }
  async function approveSighting(id) { await updateDoc(doc(db, "sighting_reports", id), { status: "verified" }); }
  async function rejectSighting(id) { await updateDoc(doc(db, "sighting_reports", id), { status: "rejected" }); }
  async function approveFound(reportId, caseId) {
    await updateDoc(doc(db, "sighting_reports", reportId), { status: "verified" });
    if (caseId) await updateDoc(doc(db, "missing_persons", caseId), { status: "found" });
  }
  async function rejectFound(id) { await updateDoc(doc(db, "sighting_reports", id), { status: "rejected" }); }

  async function render() {
    const screen = (location.hash || "#home").slice(1);
    if (screen === "home") return renderHome();
    if (screen === "register") return renderRegister();
    if (screen === "sighting") return renderSighting();
    if (screen.startsWith("found/")) return renderFoundReport(screen.slice(6));
    if (screen === "nearby") return renderNearby();
    if (screen === "admin") return renderAdmin();
    renderHome();
  }

        }
        const lastCheck = parseInt(localStorage.getItem("districtLastCheck") || "0", 10);
        const newCases = cases.filter(c =>
          (c.district || "").trim().toLowerCase() === myDistrict.trim().toLowerCase() &&
          ((c.created_at && c.created_at.seconds) ? (c.created_at.seconds * 1000) : Date.now()) > lastCheck
        );
        banner.innerHTML = `
          <div style="margin:16px 20px 0;background:${newCases.length > 0 ? '#FDF7F3' : '#FBF9F4'};border:1px solid ${newCases.length > 0 ? '#EAD2C8' : 'var(--line)'};border-radius:8px;padding:12px 14px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;">

        // Advance checkpoint only up to the newest case's own timestamp (cases seen this visit),
        // never to "now" — so genuinely new cases arriving later still trigger an alert.
        const districtCases = cases.filter(c => (c.district || "").trim().toLowerCase() === myDistrict.trim().toLowerCase());
        const maxSeen = districtCases.reduce((max, c) => {
          const t = (c.created_at && c.created_at.seconds) ? c.created_at.seconds * 1000 : 0;

          (c.district || "").toLowerCase().includes(q) ||
          (c.state || "").toLowerCase().includes(q)

        if (!isNaN(ageMin)) filtered = filtered.filter(c => parseInt(c.age, 10) >= ageMin);

          : renderCaseCards(filtered);
      }

        document.getElementById(id).addEventListener("input", applyFilters);
      });
    } catch (e) { console.error(e); }
  }

  function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  async function renderNearby() {
    el.innerHTML = `
      <header>${langToggleHtml()}<div class="eyebrow">${t('nearbyEyebrow')}</div><h1>${t('nearbyTitle')}</h1></header>
      <div style="display:flex;gap:8px;padding:14px 20px 6px;overflow-x:auto;" id="radiusChips"></div>

      ${bottomNav("nearby")}
    `;
    attachLangToggle();
    let userLat = null, userLng = null, radius = "all";

    function renderChips() {
      const opts = [["2","2km"],["5","5km"],["10","10km"],["25","25km"],["all",t('allCases')]];
      document.getElementById("radiusChips").innerHTML = opts.map(([val,label]) => `
        <div data-radius="${val}" style="flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12.5px;cursor:pointer;border:1px solid var(--line);${radius===val ? 'background:var(--teal);color:var(--white);border-color:var(--teal);' : 'background:var(--white);color:var(--slate);'}">${label}</div>
      `).join('');
      document.querySelectorAll("[data-radius]").forEach(chip => chip.addEventListener("click", () => {
        radius = chip.dataset.radius;
        renderChips();
        renderList();
      }));
    }

    let allCases = [];
    function renderList() {
      const list = document.getElementById("nearList");
      let cases = allCases;
      if (userLat !== null && radius !== "all") {
        const r = parseFloat(radius);
        cases = cases.filter(c => {
          if (c.last_seen_lat == null || c.last_seen_lng == null) return false;
          return haversineKm(userLat, userLng, c.last_seen_lat, c.last_seen_lng) <= r;
        });
      }
      if (userLat !== null) {
        cases = [...cases].sort((a, b) => {
          const da = (a.last_seen_lat != null) ? haversineKm(userLat, userLng, a.last_seen_lat, a.last_seen_lng) : Infinity;
          const db = (b.last_seen_lat != null) ? haversineKm(userLat, userLng, b.last_seen_lat, b.last_seen_lng) : Infinity;
          return da - db;
        });
      }
      if (cases.length === 0) {
        list.innerHTML = `<div style="font-size:13px;color:var(--slate);">${t('noNearby')}</div>`;
        return;
      }
      list.innerHTML = cases.map(c => {
        const mapHtml = (c.last_seen_lat && c.last_seen_lng) ? `
          <iframe
            style="width:100%;height:140px;border:none;border-radius:8px;margin-top:10px;"
            loading="lazy"
            src="https://www.openstreetmap.org/export/embed.html?bbox=${c.last_seen_lng-0.01}%2C${c.last_seen_lat-0.01}%2C${c.last_seen_lng+0.01}%2C${c.last_seen_lat+0.01}&layer=mapnik&marker=${c.last_seen_lat}%2C${c.last_seen_lng}">
          </iframe>` : '';
        let distText = '';
        if (userLat !== null && c.last_seen_lat != null) {
          distText = ` • ${haversineKm(userLat, userLng, c.last_seen_lat, c.last_seen_lng).toFixed(1)} ${t('distanceAway')}`;
        }
        const contactHtml = (c.police_station || c.police_contact) ? `
          <div style="font-size:11px;color:var(--slate);margin-top:6px;">
            ${c.police_station ? `🏢 ${c.police_station}` : ''}
            ${c.police_contact ? ` • <a href="tel:${c.police_contact}" style="color:var(--teal);">${c.police_contact}</a>` : ''}
          </div>` : '';
        return `
        <div class="row-card">
          <div style="display:flex;gap:12px;">
            <div class="ph" style="${c.photo_url ? `background-image:url('${c.photo_url}');background-size:cover;background-position:center;cursor:zoom-in;` : ''}" ${c.photo_url ? `onclick="window.open('${c.photo_url}','_blank')"` : ''}></div>
            <div style="flex:1;">
              <h4>${c.name}, ${c.age}</h4>
              <div class="meta">${c.last_seen_location||''}${distText} ${c.case_id ? `• ${c.case_id}` : ''}</div>
              ${contactHtml}
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
                <button class="btn-approve" onclick="location.hash='#sighting'">${t('iSawThem')}</button>
                <button class="btn-approve" style="background:var(--teal);border-color:var(--teal);" onclick="location.hash='#found/${c.id}'">${t('reportFound')}</button>
              </div>
            </div>
          </div>
          ${mapHtml}
        </div>`;
      }).join('');
    }

    renderChips();
    try {
      allCases = await getApprovedCases();
      renderList();
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => { userLat = pos.coords.latitude; userLng = pos.coords.longitude; renderList(); },
          () => { /* permission denied, fall back to unsorted full list */ }
        );
      }
    } catch (e) { console.error(e); }
  }

  function computeMatchScore(c, criteria) {
    let score = 0;
    if (criteria.age && c.age) {
      const diff = Math.abs(parseInt(c.age, 10) - parseInt(criteria.age, 10));
      if (!isNaN(diff)) { if (diff <= 2) score += 3; else if (diff <= 5) score += 1; }
    }
    if (criteria.gender && c.gender && criteria.gender === c.gender) score += 2;
    if (criteria.location) {
      const words = criteria.location.toLowerCase().split(/\s+/).filter(w => w.length > 2);
      const target = (c.last_seen_location || "").toLowerCase();
      if (words.some(w => target.includes(w))) score += 3;
    }
    return score;
  }

  function renderFoundReport(caseId) {
    let selectedCaseId = (caseId && caseId !== "none") ? caseId : null;
    let allVerifiedCases = [];
    el.innerHTML = `

        ${langToggleHtml()}

        <button type="submit" class="submit-btn" id="f_submit">${t('submitFound')}</button>
      </form>
    `;
    attachLangToggle();

    function renderMatches() {
      const age = document.getElementById("f_age").value;
      const gender = document.getElementById("f_gender").value;
      const locationText = document.getElementById("f_location").value;
      const box = document.getElementById("matchBox");
      if (!age && !gender && !locationText) { box.innerHTML = ""; return; }
      const scored = allVerifiedCases
        .map(c => ({ c, score: computeMatchScore(c, { age, gender, location: locationText }) }))
        .filter(x => x.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 3);
      if (scored.length === 0) {
        box.innerHTML = `<div style="font-size:12px;color:var(--slate);margin-bottom:14px;">${t('matchNone')}</div>`;
        return;
      }
      box.innerHTML = `
        <div style="background:#FBF9F4;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px;">
          <div style="font-size:12px;font-weight:700;color:var(--teal);margin-bottom:4px;">${t('matchTitle')}</div>
          <div style="font-size:11px;color:var(--slate);margin-bottom:8px;">${t('matchHint')}</div>
          ${scored.map(({c}) => `
            <div class="match-item" data-select-match="${c.id}" style="display:flex;gap:10px;align-items:center;padding:8px;border-radius:6px;cursor:pointer;background:${selectedCaseId===c.id?'#E4EEE6':'var(--white)'};border:1px solid ${selectedCaseId===c.id?'var(--green)':'var(--line)'};margin-bottom:6px;">
              <div class="ph" style="width:36px;height:36px;${c.photo_url ? `background-image:url('${c.photo_url}');background-size:cover;background-position:center;` : ''}"></div>
              <div style="flex:1;font-size:12px;">${c.name}, ${c.age} • ${c.last_seen_location||''} ${selectedCaseId===c.id ? `<b style="color:var(--green);">✓ ${t('linkedCase')}</b>` : ''}</div>
            </div>`).join('')}
        </div>`;
      box.querySelectorAll("[data-select-match]").forEach(item => item.addEventListener("click", () => {
        selectedCaseId = (selectedCaseId === item.dataset.selectMatch) ? null : item.dataset.selectMatch;
        renderMatches();
      }));
    }

    document.getElementById("f_photo").addEventListener("change", (e) => {
      const file = e.target.files[0];
      const preview = document.getElementById("f_photo_preview");
      if (file) {
        document.getElementById("f_photo_img").src = URL.createObjectURL(file);
        preview.style.display = "block";
      } else {
        preview.style.display = "none";
      }
    });
    document.getElementById("f_photo_clear").addEventListener("click", () => {
      document.getElementById("f_photo").value = "";
      document.getElementById("f_photo_preview").style.display = "none";
    });
    getApprovedCases().then(cases => { allVerifiedCases = cases; renderMatches(); }).catch(console.error);
    ["f_age","f_gender","f_location"].forEach(id => document.getElementById(id).addEventListener("input", renderMatches));

    document.getElementById("foundForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (document.getElementById("f_hp").value) { return; }
      const errBox = document.getElementById("f_error");
      const photoFile = document.getElementById("f_photo").files[0];
      if (!photoFile) {
        errBox.style.display = "block";
        errBox.textContent = t('foundPhotoRequired');
        return;
      }
      const lastSubmit = parseInt(localStorage.getItem("lastSubmitTime") || "0", 10);
      if (Date.now() - lastSubmit < 30000) {
        errBox.style.display = "block";
        errBox.textContent = lang === "te" ? "దయచేసి కొన్ని సెకన్లు ఆగి మళ్ళీ try చేయండి." : "Please wait a moment before submitting again.";
        return;
      }
      const btn = document.getElementById("f_submit");
      btn.disabled = true; btn.textContent = t('uploadingPhoto');
      try {
        const photo_url = await uploadPhoto(photoFile);
        btn.textContent = t('submitting');
        await submitFoundReport({
          case_id: selectedCaseId || "",
          location: document.getElementById("f_location").value || "-",
          found_datetime: document.getElementById("f_datetime").value,
          approx_age: document.getElementById("f_age").value,
          approx_gender: document.getElementById("f_gender").value,
          notes: document.getElementById("f_notes").value,
          reporter_phone: document.getElementById("f_phone").value,
          photo_url,
        });
        localStorage.setItem("lastSubmitTime", String(Date.now()));
        el.innerHTML = `<div class="success"><div class="icon">✅</div><h2>${t('foundSuccess')}</h2><p style="color:var(--slate);font-size:13.5px;">${t('foundSuccessSub')}</p></div>`;
        setTimeout(() => location.hash = "#home", 1800);
      } catch (err) {
        console.error(err);
        errBox.style.display = "block";
        errBox.textContent = t('errorGeneric');
        btn.disabled = false; btn.textContent = t('submitFound');
      }
    });
  }

  }

  render();
  setTimeout(() => { const s = document.getElementById("splash"); if (s) s.remove(); }, 2300);

  // ---------- PWA: register service worker ----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch((e) => console.error("SW registration failed:", e));
    });
  }
</script>
</body>
</html>
